# 《一句话的旅行》· 兔缺 —— 从旧线（`src/topics/tu-que.ts`）移植
#
# 旧那一期是手写 TS + 自己的渲染器（`topic-film.tsx`，约 1400 行）。这一份是同一期内容
# 在新工作流里的形态：一份 yaml，其余交给 `longform:voice|build|sheet`。
# 规则见 `docs/longform.md`，结构照 `src/topics/pangxie/film.yaml`。
#
# **引文一律从语料复制**（`TCM-Ancient-Books-master/`，GB18030）。下面每一条 `before`/`target`/`after`
# 都是从 `npm run entry -- --grep=` 读出来的原文，去掉标点后是那本书里连续的一段。
# 旧线那句「缺唇两个字出现在五十一部书里」的数字，由 `dots` 的 `search`/`expect` 现场跑全语料核对。

id: tu-que
series: 一句话的旅行
title: 兔缺
music: music/yuzhou-changwan.mp3
musicVolume: 0.1
voice: { name: zh-CN-YunjianNeural, rate: "-8%" }

# 这一期不用实拍图：证据全部是照语料录文排出来的书页。
images: {}

cover:
  question: 吃兔肉会生下唇裂的孩子吗
  deck: 一个因为「长得像」而得来的名字

segments:
  # ── 立案：冷开场。第一帧就是书页，直接念那句话，不放片头 ──────────────
  - chapter: 立案
    narration: 元朝天历三年，太医忽思慧把掌管宫廷饮食的经验写成书，献给皇帝。书名《饮膳正要》。书里记着一条：食兔肉，令子无声缺唇。
    shots:
      - type: page
        at: 0
        book: 饮膳正要
        meta: 元 · 忽思慧 · 妊娠所忌
        file: 009-饮膳正要.txt
        before: 妊娠所忌∶
        target: 食兔肉，令子无声缺唇。
        after: 食山羊肉，令子多疾。食鸡子、干鱼，令子多疮。
        zoom: { from: 元朝-0.3, to: 一条+0.5, scale: 1.12 }
        marks:
          - { text: 食兔肉令子无声缺唇, at: 食兔肉, to: 缺唇 }

  - narration: 这句话不是忽思慧写的。在他之前，它已经传了一千五百年；在他之后，至少五十部医书又把它抄了一遍。而它最早的样子，说的不是吃，是看见。
    shots:
      - type: dots
        at: 一千五百年-0.3
        search: "缺唇"
        expect: 51
        countLabel: 部古籍，逐字检索
        hitLabel: 部书传过这条说法
        note: 检索式：缺唇　同书异本合并计
        hitAt: 五十部

  # ── 追踪：这句话按年代走过哪些书 ──────────────────────────────────
  - chapter: 追踪
    narration: 再往前追，最早的出处是《淮南子》：孕妇见兔而子缺唇，见麋而子四目。孕妇看见兔子，孩子唇裂；看见麋鹿，孩子有四只眼睛。后半句今天没有人信了，可前半句一路传到了明清。
    shots:
      - type: lineage
        at: -0.4
        title: 同一句话，按成书先后排开（连线示意流传顺序，非考定的抄录关系）
        burstAt: 明清
        nodes:
          - { name: 礼记·内则, dyn: 先秦, year: -200 }
          - { name: 淮南子, dyn: 汉, year: -139, key: true, at: 淮南子 }
          - { name: 诸病源候论, dyn: 隋, year: 610, key: true, at: 往前追 }
          - { name: 外台秘要, dyn: 唐, year: 752 }
          - { name: 本草拾遗, dyn: 唐, year: 739 }
          - { name: 太平圣惠方, dyn: 北宋, year: 992 }
          - { name: 妇人大全良方, dyn: 南宋, year: 1237 }
          - { name: 饮膳正要, dyn: 元, year: 1330, key: true }
          - { name: 饮食须知, dyn: 元, year: 1350 }
          - { name: 本草蒙筌, dyn: 明, year: 1565 }
          - { name: 本草纲目, dyn: 明, year: 1578, key: true }
          - { name: 普济方, dyn: 明, year: 1406 }
          - { name: 外科大成, dyn: 清, year: 1665 }
          - { name: 疡医大全, dyn: 清, year: 1760 }
      - type: columns
        at: 前半句-0.2
        source: 《本草蒙筌》· 明 · 陈嘉谟
        file: 012-本草蒙筌.txt
        lines: [孕妇见兔而子缺唇，见麋而子四目。, 物有自然，而似不然者。, 麋有四目，其二夜目也。]
        emphasize: 1
        emphasizeAt: 一路传到

  # ── 对质：古人不是只传不解释，而后人也不是没有反驳 ──────────────────
  - chapter: 对质
    narration: 古人也不是只传不解释。唐代的陈藏器给过一套理由：兔尻有孔，子从口出，故妊妇忌之。兔子屁股上有个孔，小兔子从嘴里生出来，所以孕妇要忌。李时珍把这句收进了《本草纲目》。
    shots:
      - type: page
        at: -0.3
        book: 本草纲目
        meta: 明 · 李时珍 · 引陈藏器
        file: 013-本草纲目.txt
        before: 藏器曰∶
        target: 兔尻有孔，子从口出，故妊妇忌之，非独为缺唇也。
        # `after` 留空：语料里这一句在「损元」处换行，再接「阳，令人痿黄。」——
        # 跨行的引文不算连续原文，`longform:build` 会 FAIL。要接就得把换行后的字也照录，
        # 而那一段与这一期无关，所以到 target 为止。
        after: ""
        zoom: { from: 陈藏器-0.2, to: 理由+0.6, scale: 1.12 }
        marks:
          - { text: 兔尻有孔子从口出故妊妇忌之, at: 兔尻, to: 忌之 }

  - narration: 也不是没有人反驳。明代的《本草蒙筌》引完《淮南子》，加了一句评论：物有自然，而似不然者。道理有它自然的样子，只是看起来不像。他说的其实是：看着像，不代表真的。
    shots:
      - type: columns
        at: -0.3
        source: 《本草蒙筌》· 卷九
        file: 012-本草蒙筌.txt
        lines: [孕妇见兔而子缺唇，见麋而子四目。, 物有自然，而似不然者。, 麋有四目，其二夜目也。]
        emphasize: 2
        emphasizeAt: 一句评论

  - narration: 而同一批医书里还有另一条线：唇裂在外科书里是实打实的病，而且有手术。《外科大成》里有二龙散，补缺唇，也救自刎血流如注的人。写这些方子的大夫，一边传抄吃兔肉会生唇裂，一边在给唇裂的孩子做缝合。
    shots:
      - type: page
        at: -0.3
        book: 外科大成
        meta: 清 · 祁坤
        file: 226-外科大成.txt
        before: ""
        target: 补缺唇。救自刎血流如注者。敷三时则口合。
        after: ""
        zoom: { from: 二龙散-0.2, to: 缝合+0.6, scale: 1.12 }
        marks:
          - { text: 补缺唇, at: 二龙散 }

  # ── 结案：一个字落下，盖印 ────────────────────────────────────────
  - chapter: 结案
    narration: 回到最开始那个疑问：为什么见麋而子四目没有人再提，见兔而子缺唇却传了一千五百年？一个可能的原因是名字。唇裂长得像兔唇，所以叫兔缺。这个名字让兔子一直留在唇裂的旁边。
    shots:
      - type: page
        at: -0.4
        book: 诸病源候论
        meta: 隋 · 巢元方 · 兔缺候
        file: 571-诸病源候论.txt
        before: ""
        target: 人有生而唇缺，似兔唇，故谓之兔缺。
        after: 世云，由妇人妊娠时见兔及食兔肉使然。
        zoom: { from: 一个可能的原因-0.2, to: 所以叫兔缺+0.6, scale: 1.12 }
        marks:
          - { text: 似兔唇，故谓之兔缺, at: 长得像, to: 兔缺 }
      - type: verdict
        at: 这个名字-0.3
        char: 兔
        seal: 结案
        slamAt: 一直留在-0.1

  - narration: 但有一件事，古人的方向没有错。孕期的营养和药物，确实会影响唇裂的风险。他们担心的事是真的，只是归因归错了地方。一条传了一千五百年的禁忌，起点可能只是一个名字。
    shots:
      - type: silent
        at: -0.3
        count: 0
        text: 像兔唇　所以叫兔缺　至于为什么像　没有人问过

end:
  next: 下一期 · 当归，为什么叫「当归」
  sources: 引文照录：《饮膳正要》《诸病源候论》《本草蒙筌》《本草纲目》《外科大成》等五十余部
  disclaimer: 古籍记载仅供文化阅读，孕期饮食请遵医嘱
