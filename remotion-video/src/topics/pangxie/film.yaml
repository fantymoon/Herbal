# 《一句话的旅行》· 螃蟹与横生 —— 金样例
#
# 这是长视频线的「标准答案」：新一期照这个文件的结构写。规则见 docs/longform.md。
# 改完旁白：python3 scripts/longform/voice.py pangxie
# 改完镜头：npm run longform:build -- pangxie   （校验引文、换算时间、检查版面）
# 看效果：  npm run longform:sheet -- pangxie   （每个镜头一张截图的联络表）
#
# `at` 写旁白里的词（可带 +0.3 / -0.2 偏移，#2 表示第二次出现），不写秒数。
# 负数秒表示比本段旁白早一点进镜头（用于换段时提前切画面）。

id: pangxie
series: 一句话的旅行
title: 螃蟹与横生
music: music/kongyin-gujian.mp3
musicVolume: 0.1
voice: { name: zh-CN-YunjianNeural, rate: "-8%" }

# 封面与标题必须是同一句话——观众先看到哪个，收到的都是同一个承诺。
cover:
  question: 孕妇吃螃蟹，孩子会横着生吗
  deck: 一句话追了一千年 · 十九部书抄过它

images:
  crab:
    file: images/crab-eriocheir-koln.jpg
    credit: "Photo: Vassil / Wikimedia Commons, CC BY-SA 4.0"

segments:
  - chapter: 立案
    narration: 北宋的《证类本草》，在“蟹”这一条底下，夹着一句话：妊娠人不得食螃蟹，令儿横生也。
    shots:
      - type: page # 冷开场：第一帧就是书页，不放片头
        at: 0
        book: 证类本草
        meta: 北宋 · 蟹
        file: 645-证类本草.txt
        before: 孙真人十二月勿食蟹伤神简要济众小儿解颅不合生蟹足骨半两焙干白蔹半两为末用乳汁和贴骨缝上以瘥为度杨氏产乳
        target: 妊娠人不得食螃蟹令儿横生也
        after: 荀卿云蟹六跪而二螯非蛇鳝之穴无所寄托
        zoom: { from: 在-0.3, to: 一句话+0.5, scale: 1.12 }
        marks:
          - { text: 妊娠人不得食螃蟹令儿横生也, at: 妊娠, to: 也 }

  - narration: 横生，是胎儿横在腹中，难产里最凶险的一种。这句话，我们在七百零一部古籍里检索，找到十九部书在说。
    shots:
      - type: photo
        at: -0.4
        image: crab
        zoom: [1.05, 1.22]
        pan: [30, -40]
        title: 横生
        gloss: 胎儿横卧腹中，古人难产之一
        titleAt: 0
      - type: dots
        at: 这句话-0.3
        search: "蟹[^。\\n]{0,10}横生|横生[^。\\n]{0,6}蟹|娠妇食之，令子横生|怀孕妇食下?，令子横生"
        merge: [[132, 636]] # 《女科证治准绳》与《证治准绳·女科》是同一部书
        expect: 19
        countLabel: 部古籍，逐字检索
        hitLabel: 部书写过这句话
        note: 检索式：蟹…横生　同书异本合并计
        hitAt: 十九

  - chapter: 追踪
    narration: 它最早引自唐代的《杨氏产乳》。宋人把它收进本草；南宋，它进了《妇人大全良方》；到了明清，它和兔肉、雀肉排在一起，成了孕妇食忌里固定的一行。
    shots:
      - type: lineage
        at: -0.4
        title: 同一句话，按成书先后排开（连线示意流传顺序，非考定的抄录关系）
        burstAt: 明清
        nodes:
          - { name: 杨氏产乳, dyn: 唐, year: 820, key: true, at: 引自 }
          - { name: 证类本草, dyn: 北宋, year: 1082, key: true, at: 宋人 }
          - { name: 妇人大全良方, dyn: 南宋, year: 1237, key: true, at: 南宋 }
          - { name: 卫生易简方, dyn: 明, year: 1410 }
          - { name: 古今医统大全, dyn: 明, year: 1556 }
          - { name: 本草蒙筌, dyn: 明, year: 1565 }
          - { name: 医学入门, dyn: 明, year: 1575 }
          - { name: 本草纲目, dyn: 明, year: 1578 }
          - { name: 证治准绳·女科, dyn: 明, year: 1607 }
          - { name: 济阴纲目, dyn: 明, year: 1620 }
          - { name: 宜麟策, dyn: 明, year: 1624 }
          - { name: 医灯续焰, dyn: 清, year: 1652 }
          - { name: 冯氏锦囊秘录, dyn: 清, year: 1702 }
          - { name: 胎产心法, dyn: 清, year: 1730 }
          - { name: 医学心悟, dyn: 清, year: 1732 }
          - { name: 竹林女科证治, dyn: 清, year: 1786 }
          - { name: 急救广生集, dyn: 清, year: 1805 }
          - { name: 女科要旨, dyn: 清, year: 1820 }
          - { name: 评注产科心法, dyn: 清末, year: 1880 }
          - { name: 儿科要略, dyn: 民国, year: 1925 }
      - type: columns
        at: 兔肉+0.9
        source: 《证治准绳·女科》· 明
        file: 636-证治准绳·女科.txt
        lines: [食兔肉，令子唇缺。, 食鳖，令子项短及损胎。, 食鸭子共桑椹同食，令子倒生心寒。, 食螃蟹，令子横生。]
        emphasize: 3
        emphasizeAt: 孕妇

  - chapter: 对质
    narration: 可为什么偏偏是螃蟹？十九部书，大多不说理由。清初的张璐，把话说破了：以其性专逆水横行也。螃蟹横着走，孩子就横着生。
    shots:
      - type: photo
        at: -0.4
        image: crab
        zoom: [1.6, 1.75]
        pan: [-120, -160]
        y: 60
        title: 为什么是螃蟹？
        titleAt: 可
      - type: silent
        at: 十九-0.2
        count: 19
        text: 十九部书　只说「不可」　不说「为何」
      - type: confront
        at: 清初-0.2
        image: crab
        arrow: ← 横行 →
        arrowAt: 横行
        book: 本经逢原
        meta: 清 · 张璐
        file: 019-本经逢原.txt
        before: 凡物之赤者皆热惟蟹与柿性寒所以二物不宜同食令人泄泻发症瘕
        target: 妊娠忌食以其性专逆水横行也
        after: 其爪为催生下死胎胞衣专药
        marks:
          - { text: 以其性专逆水横行也, at: 以其, to: 也 }
          - { text: 横行, at: 横行 }
        morph: { from: 横行, to: 横生, at: 螃蟹#2+0.3 }

  - chapter: 结案
    narration: 到了民国，《儿科要略》写下四个字：未可尽信。一条禁忌走了一千多年，凭的只是一个字。
    shots:
      - type: page
        at: -0.4
        book: 儿科要略
        meta: 民国
        file: 137-儿科要略.txt
        before: 鲫鱼童鸡童鸭鲈鱼海参猪脂猪腰猪肺麻油淡菜笋之类昔人亦谓其颇适于孕妇
        target: 若谓不可食蛙生子令哑不可食蟹横生倒产不可食雀令子多淫虽未可尽信
        after: 要亦不可不信
        zoom: { from: 民国-0.2, to: 四个+0.6, scale: 1.12 }
        marks:
          - { text: 不可食蟹横生倒产, at: 民国+0.2 }
          - { text: 未可尽信, at: 未可, to: 尽信+0.3 }
      - type: verdict
        at: 一个-0.3
        char: 横
        seal: 结案
        slamAt: 字#2-0.1

end:
  next: 下一期 · 当归，为什么叫「当归」
  sources: 引文照录：《证类本草》《证治准绳·女科》《本经逢原》《儿科要略》等十九部
