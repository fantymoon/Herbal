# 《一句话的旅行》· 当归，为什么叫「当归」
#
# 上一期（pangxie）的 `end.next` 预告的就是这一期，id 也早已定在 longformCompId 的注释里。
# 规则见 docs/longform.md；考据底稿见 .workbuddy-ai/memory/2026-10-10.md。
#
# 这一期的问题：一味药，为什么叫「当归」？
# 语料里对这个问题有**两种互相对立的答案**，而且都写在《本草纲目》同一条里：
#   1. 名字是招人回来的典故——《古今注》「古人相赠以芍药，相招以文无」，文无即当归。
#   2. 名字来自药效——陈承「能使气血各有所归，恐当归之名必因此出也」。
# 所以中段是「对质」。结案那句必须正面回掉封面问题：两种说法都记在书上，书上没有唯一的答案。
#
# 弃用：姜维「但有远志，不在当归」——《三国志》在语料里 0 命中，引文规则只许从语料复制。
#
# `at` 写旁白里的词，不写秒数。引文只能从语料复制，构建时逐字核对。

