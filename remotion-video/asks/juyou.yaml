# 本草一问 · 02 · 橘柚
#
# 《神农本草经》把橘和柚写成一条，而这一条的别名写的是「橘皮」。
# 宋人寇宗奭说那是「后人误加柚字」，到《本草纲目》李时珍干脆拆成两条。
#
# 「书」屏上摆的是整段原文，旁白只读末尾那四个字——所以 read 必须同时是
# 旁白与引文的连续子串（ask-build 两头都核），朱红才会从对的位置开始亮。
#
# 配图说明：这一集只取到**柚的叶**。开放数据通道里 iNaturalist 的 Citrus maxima
# 观察全是营养器官（叶、干），而搜「Citrus reticulata」返回的果实照经核对
# 观察者鉴定为 Citrus × aurantium（酸橙），不是橘——那两张已经删掉。
# 所以「物」段改成讲叶：芸香科的翼叶（箭叶）本来就是一个正经的名物特征。

