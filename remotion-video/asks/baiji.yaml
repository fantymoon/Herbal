segments:
  # 问：全幅实物照 + 大字问题。第 0 帧即封面。
  - role: ask
    narration: 《神农本草经》给白棘写了四个字：痈肿渍脓。别的书都写「溃脓」。
    photos:
      - file: baiji-fruit.jpg
        caption: 酸枣的果

  # 物：它今天是什么、你在哪见过它。
  - role: object
    narration: 白棘不是一种草，是酸枣树上的刺。酸枣丛生，枝条上长满硬针，秋天结出指头大的小果。
    photos:
      - file: baiji-leaves.jpg
        caption: 叶与果
      - file: baiji-branch.jpg
        caption: 生在碎石坡上的酸枣丛

  # 书：竖排原文，读到哪个字哪个字朱红。
  - role: book
    narration: 《神农本草经》这一条写「痈肿渍脓」——渍，是浸泡的渍。
    read: 渍脓
    quote:
      text: 味辛，寒。主心腹痛，痈肿渍脓，止痛。一名棘针。生川谷。
      source: 《神农本草经》卷二 · 中经

  # 考：跨书对读。三条都写「溃」，最后一条给出理由。
  - role: study
    narration: 可别的书都写「溃」。《名医别录》抄的《本经》原文写「溃」，《证类本草》写「溃」，李时珍也写「溃」。清人张璐把这一句解作「决刺破结」——刺能破开，脓才出得来，所以要的是「溃」。
    evidence:
      - text: 主心腹痛，痈肿溃脓，止痛。一名棘针。生川谷。
        source: 《名医别录》引《本经》原文 · 梁
        note: 抄《本经》时写的是「溃」
      - text: 主心腹痛，痈肿溃脓，止痛，决刺结。
        source: 《证类本草》· 宋（唐慎微）
        note: 宋人也写「溃」
      - text: 白棘乃小枣树上针，故能决刺破结。《本经》主痈肿溃脓，与皂刺不甚相远。
        source: 《本经逢原》· 清（张璐）
        note: 张璐：刺能破结，故说「溃」
      - text: 心腹痛，痈肿溃脓，止痛（《本经》）。
        source: 《本草纲目》木部 · 明（李时珍）
        note: 注明出自《本经》，仍作「溃」

  # 收：盖印 + 下集预告 + 小字免责。
  # 收尾必须正面回答 question：「渍」是「溃」的讹字，因为渍是浸泡，痈肿不会「浸泡出脓」。
  - role: closing
    narration: 是错字。「渍」是浸泡，痈肿不会浸出脓来；要排脓，得先溃破——底本把一个「溃」写成了「渍」。下一味，天名精。

sources:
