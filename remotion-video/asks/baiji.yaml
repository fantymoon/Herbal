# 本草一问 · 10 · 白棘
#
# 「古书写错的字」第四集。底本《神农本草经》白棘条件「痈肿渍脓」，
# 而《名医别录》抄的《本经》原文、《证类本草》、《本草纲目》、《本经逢原》都作「痈肿溃脓」——
# `npm run variants` 报的正是这一条（底本 0 处作证，证类 6 处）。
#
# 渍与溃：渍是浸泡，溃是溃破。痈肿要排脓，得先溃破，「渍脓」在这一句里没有着落；
# 而「溃脓」是外科的常语（《外科心法要诀》《疡医大全》都在用「溃脓」）。
# 所以这一集和天雄、败酱同属「讹字」，但理由要说清：是**这个词在这一句里不成话**，
# 不是「底本字丑」。
#
# 「书」屏摆的是本经全文，旁白只读其中「渍脓」两个字。
#
# 配图说明：白棘＝酸枣树针（《证类》引李当之「此是酸枣树针」）。
# iNaturalist 上 Ziziphus jujuba spinosa 是酸枣的变种名，`--fruiting` 筛出的三张都带果。
# 单味药线没有做过白棘，四张图都是本集新取的，不与他片重复。

id: baiji
entry: 白棘
collection: 古书写错的字
deck: 古书写错的字 · 04
question: "「痈肿渍脓」\n这个字写错了吗？"
accent: "#4a6b5a"                 # 草部青
music: music/fengguo-yanjiao.mp3
