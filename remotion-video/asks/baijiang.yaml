segments:
  # 问：全幅实物照 + 大字问题。第 0 帧即封面。
  - role: ask
    narration: 《神农本草经》给败酱记了一串病名，其中一个只有这一本书这么写。
    photos:
      - file: baijiang-flower.jpg
        caption: 败酱

  # 物：它今天是什么、你在哪见过它。
  - role: object
    narration: 败酱是败酱科的草本，秋天开一丛小黄花，长在路边和草坡上。名字来自它的气味。
    photos:
      - file: baijiang-cluster.jpg
        caption: 一丛小黄花
      - file: baijiang-leaf.jpg
        caption: 叶是羽状分裂的
      - file: baijiang-plant.jpg
        caption: 生在草坡上

  # 书：竖排原文，读到哪个字哪个字朱红。
  - role: book
    narration: 《神农本草经》给败酱记的是「疥瘙，疸痔」——疸，是黄疸的疸。
    read: 疸痔
    quote:
      text: 味苦，平。主暴热火创、赤气，疥瘙，疸痔，马鞍热气。一名鹿肠。生川谷。
      source: 《神农本草经》卷二 · 中经

  # 考：跨书对读。三条都写「疽」，最后一条给出时珍的注明。
  - role: study
    narration: 可别的书都不这么写。《名医别录》抄的《本经》原文写「疽」，《证类本草》写「疽」，李时珍也写「疽」——他还特意注明，这一句出自《本经》。
    evidence:
      - text: 主暴热火疮赤气，疥瘙疽痔，马鞍热气。
        source: 《名医别录》引《本经》原文 · 梁
        note: 抄《本经》时写的是「疽」
      - text: 主暴热火疮赤气，疥瘙，疽痔，马鞍热气。
        source: 《证类本草》· 宋（唐慎微）
        note: 宋人也写「疽」
      - text: 暴热火疮赤气，疥瘙疽痔，马鞍热气（《本经》）。
        source: 《本草纲目》草部 · 明（李时珍）
        note: 注明出自《本经》，仍作「疽」

  # 收：盖印 + 下集预告 + 小字免责。
  - role: closing
    narration: 一个字写错，这一串病名就跳出了皮肤。下一味，百合。

sources:
