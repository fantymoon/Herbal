# 本草一问 · 08 · 败酱
#
# 「古书写错的字」第二集。底本《神农本草经》作「疥瘙，疸痔」，
# 而《名医别录》《证类本草》《本草纲目》都作「疥瘙，疽痔」——纲目还注明
# 这一句出自《本经》。三处他本对读，底本那一读法全库几乎无人作证
# （`npm run variants` 报的就是这一条）。
#
# 疸是黄疸，疽是深部的疮。「疥瘙」是皮肤病，和它并列的该是「疽」——
# 写成「疸」，这一串就跳出了皮肤病的范围。
#
# 「书」屏摆的是本经全文，旁白只读其中「疸痔」两个字。
#
# 配图说明：Patrinia scabiosaefolia（iNat 记作 PATRINIA SCABIOSIFOLIA，拼法差一个字母，
# 同一个种）。四张都是横构图，正好给物屏 936×700 的横框；问屏是全幅 cover，取花丛那张。

id: baijiang
entry: 败酱
collection: 古书写错的字
deck: 古书写错的字 · 02
question: "《本经》的「疸痔」\n是错字吗？"
accent: "#4a6b5a"                 # 草部青
