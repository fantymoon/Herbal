# 本草一问 · 06 · 藕实茎
#
# 《神农本草经》上经里的一条药，名字是三个字：藕、实、茎。这一集只回答一件事——
# 为什么一条药名要把三个部位连在一起。
#
# 答案不在《本经》的经文里，而在这一条的案语里：孙星衍辑本引《说文》
# 「藕，夫渠根；莲，夫渠之实也；茄，夫渠茎」——三个字，正好是荷的三个部位。
# 所以「书」屏照录的是这一句。它是这一条自己的案语，不是从别处借来的引文。
#
# 「夫渠」是这一版的写法（通「芙蕖」）。**照录不改**，旁白也照读，屏幕上与耳朵里
# 是同一个字——这一系列宁可让观众看见一个生僻写法，也不做一处无声的改动。
#
# 「考」屏的对读是这一集真正的转折：连最早的注家都说不准第三个字指什么，
# 到宋代名字已经串了，到明代连「荷」这个字指哪个部位都有三种说法。
#
# 配图说明：四张都是 Nelumbo nucifera，观察者鉴定与搜索属名一致（fetch-photo --check 无 ⚠）。
# 问屏是全幅 1080x1920 的 cover 裁切，所以只给竖构图的 nelumbo-flower（1536x2048）；
# 物屏是 936x700 的横框，三张 2048x1150 的横幅正好。
#
# 另：`oushijing-nelumbo.jpg` 已被单味药线的藕实茎片引用，这一集不重复用它。

