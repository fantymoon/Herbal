  # 书：竖排原文，读到哪个字哪个字朱红。
  # read 必须同时是 narration 与 quote 的连续子串（ask:build 两头都核）。
  - role: book
    narration: 《说文解字》说得最清楚：藕，夫渠根；莲，夫渠之实也；茄，夫渠茎。
    read: 藕，夫渠根；莲，夫渠之实也；茄，夫渠茎。
    quote:
      text: 藕，夫渠根；莲，夫渠之实也；茄，夫渠茎。
      source: 《说文解字》（《神农本草经》藕实茎条案引）

  # 考：跨书对读。三条按朝代走，最后一条给出时珍的判决。
  - role: study
    narration: 可这条名字一开始就让人犯难：陶弘景猜，那个「茎」恐怕其实是根。到宋代，名字已经串了——蜀地人把藕叫茄，而「茄」本是茎的名字。到明代，李时珍发现连「荷」指什么都不统一。
    evidence:
      - text: 今云茎，恐即是根，不尔不应言甘也。
        source: 《本草经集注》· 梁（陶弘景）
        note: 最早的注家也说不准「茎」指哪个部位，只从「味甘」倒推
      - text: 此皆名相错，习俗传误，失其正体也。
        source: 《证类本草》· 宋（唐慎微）
        note: 北方人把藕叫荷，蜀地人把藕叫茄
      - text: 茎乃负叶者也，有负荷之义，当从陆说。
        source: 《本草纲目》草部 · 明（李时珍）
        note: 「荷」是根、是叶还是茎，三人三说；李时珍判给了茎

  # 收：盖印 + 下集预告 + 小字免责。
  - role: closing
    narration: 一条药名，把三个部位连在一起。下一味，徐长卿。

