segments:
  - role: ask
    narration: 王不留行——这四个字不像药名，像一句命令。
    photos:
      - file: vaccaria-hispanica-flower.jpg
        caption: 王不留行

  - role: object
    narration: 它是一年生的小草，麦地里最多。开粉红色的小花，蒴果像个灯笼，种子黑亮。
    photos:
      - file: vaccaria-hispanica-habit.jpg
        caption: 生在麦地里
      - file: vaccaria-hispanica-fruit.jpg
        caption: 蒴果

  - role: book
    narration: 李时珍在《本草纲目》里说：此物性走而不住，虽有王命不能留其行，故名。
    read: 此物性走而不住，虽有王命不能留其行，故名。
    quote:
      text: 此物性走而不住，虽有王命不能留其行，故名。
      source: 《本草纲目》草部 · 王不留行 · 释名

  - role: study
    narration: 它还有别的名字：禁宫花、剪金花、金盏银台。而《吴普本草》里把它写成「王不流行」——李时珍说，那是错的。
    evidence:
      - text: 禁宫花（《日华》）、剪金花（《日华》）、金盏银台。
        source: 《本草纲目》· 释名（引《日华子本草》）
        note: 三个别名，都取自它的花
      - text: 《吴普本草》作一名王不流行，盖误也。
        source: 《本草纲目》· 释名
        note: 李时珍：这个写法是错的

  - role: closing
    narration: 一个名字被写错过，还是留下来了。下一味，防己。

sources:
  - 《神农本草经》卷一·上经（汉）
  - 《吴普本草》（见《本草纲目》引）
  - 《日华子本草》（见《本草纲目》引）
  - 《本草纲目》草部（明·李时珍）
