# 本草一问 · 03 · 王不留行
#
# 这一集不问功效，只问名字：为什么一味药叫「王不留行」。
# 答案来自《本草纲目》的【释名】——李时珍说「虽有王命不能留其行」，
# 并指出《吴普本草》把它写成「王不流行」是错的。
#
# 所以「书」屏引的是纲目的释名，不是《本经》——这一集要找的答案本来就不在本经里。

id: wangbuliuxing
entry: 王不留行
collection: 名字古怪的药
deck: 名字古怪的药 · 01
question: 一味药的名字，为什么像一句军令？
accent: "#4a6b5a"                 # 草部青
music: music/kongyin-gujian.mp3
