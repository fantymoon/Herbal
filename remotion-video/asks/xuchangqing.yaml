# 本草一问 · 07 · 徐长卿
#
# 这一集回答一个问题：一味药为什么以一个人的名字命名。
#
# 答案在《本草纲目》的释名里，而且是李时珍自己下的断语：
# 「徐长卿，人名也，常以此药治邪病，人遂以名之。」
#
# 但这一集真正的意思在另一头：《本经》给它的别名是「鬼督邮」——督邮是汉代的官。
# 于是这味药有两个名字，一个来自一个人，一个来自一个官衔。
# 「考」屏的三条对读就沿着这条线走：名字一直没定下来，两个名字还互相混。
#
# 「书」屏读的是别名那三个字（read 必须同时是旁白与引文的连续子串，ask:build 两头都核）。
#
# 配图说明：iNaturalist 把 `Cynanchum paniculatum`、`Vincetoxicum pycnostelma` 都归到
# 同一个 taxon（`Vincetoxicum bungei`，id 1638659），所以 `--check` 的 ⚠ 在这里是
# 同物异名造成的假警报，不是配错——查 `api.inaturalist.org/v1/taxa?q=Cynanchum+paniculatum`
# 返回的就是 1638659。形态也对得上《纲目》的「叶似柳，两叶相当」：细长对生的叶，
# 加普草科典型的蓇葖果。credits.json 记的是 iNat 自己的名字，片内署名照它显示，不遮掩。

