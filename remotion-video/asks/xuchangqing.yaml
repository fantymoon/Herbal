segments:
  # 问：全幅实物照 + 大字问题。第 0 帧即封面。
  - role: ask
    narration: 《神农本草经》里有一味药，名字是一个人的名字：徐长卿。
    photos:
      - file: xuchangqing-plant.jpg
        caption: 徐长卿

  # 物：它今天是什么、你在哪见过它。
  - role: object
    narration: 徐长卿是夹竹桃科的草本，叶子细长像柳叶，两两相对。古书就是这么记它的。
    photos:
      - file: xuchangqing-pods.jpg
        caption: 结的果，细长而尖
      - file: xuchangqing-leaves.jpg
        caption: 叶似柳，两叶相当
      - file: xuchangqing-habitat.jpg
        caption: 生在草坡上

  # 书：竖排原文，读到哪个字哪个字朱红。
  - role: book
    narration: 《神农本草经》给徐长卿记了一个别名——鬼督邮。督邮，是汉代的一个官。
    read: 鬼督邮
    quote:
      text: 味辛，温。主鬼物、百精、蛊毒，疫疾，邪恶气，温疟。久服，强悍、轻身。一名鬼督邮。生山谷。
      source: 《神农本草经》卷一 · 上经

  # 考：跨书对读。名字一直没定下来，最后一条给出时珍的断语。
  - role: study
    narration: 陶弘景注《本草经》时也犯难：另有一条「石下长卿」，别名也叫徐长卿。到明代，李时珍给了答案——徐长卿，人名也。他还补了一句：这味药和鬼督邮，两个名字古人一直在混。
    evidence:
      - text: 此又名徐长卿，恐是误尔，方家无用。
        source: 《证类本草》· 宋（引陶隐居）
        note: 另有一条「石下长卿」，别名也叫徐长卿
      - text: 徐长卿，人名也，常以此药治邪病，人遂以名之。
        source: 《本草纲目》释名 · 明（李时珍）
        note: 名字的来历：用这味药的那个人
      - text: 徐长卿之乱鬼督邮，其苗不同，其功同也。
        source: 《本草纲目》集解 · 明（李时珍）
        note: 两个名字互相混，李时珍把它们拆开

  # 收：盖印 + 下集预告 + 小字免责。
  - role: closing
    narration: 一个名字来自一个人，另一个来自一个官衔。下一味，败酱。

