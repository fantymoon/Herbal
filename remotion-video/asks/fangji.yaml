# 本草一问 · 04 · 防己
#
# 名字古怪的药第二集。答案来自《本草纲目》【释名】引李杲一句话：
# 「防己如险健之人，幸灾乐祸，能首为乱阶，若善用之，亦可御敌。」
# 一味药被比作一个幸灾乐祸、能挑头作乱的人——但用得好，也能御敌。
#
# 本经给它的别名是「解离」，李时珍说那是因为根上的纹路散解（「解离，因其纹解也」）。

