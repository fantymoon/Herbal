segments:
  # 问：全幅实物照 + 大字问题。第 0 帧即封面。
  - role: ask
    narration: 《神农本草经》里有一味药，名字一口气给了三个。
    photos:
      - file: tianmingjing-plant.jpg
        caption: 天名精

  # 物：它今天是什么、你在哪见过它。
  - role: object
    narration: 天名精是菊科的草，夏秋抽条，像薄荷；花紫白色，叶子像小白菜。
    photos:
      - file: tianmingjing-flower.jpg
        caption: 花紫白色
      - file: tianmingjing-habitat.jpg
        caption: 生在平原川泽

  # 书：竖排原文，读到哪个字哪个字朱红。
  - role: book
    narration: 《本经》在一条药底下写：一名麦句姜，一名虾蟆蓝，一名豕首——三个名字都算数。
    read: 一名麦句姜，一名虾蟆蓝
    quote:
      # 只摆别名这一句。整条 53 字排上去会挤成五列，「一名豕首」被拆到两列，
      # 而且主瘀血、血瘕那一串跟本集的问法无关——这一屏只该有名字。
      text: 一名麦句姜，一名虾蟆蓝，一名豕首。生川泽。
      source: 《神农本草经》卷一 · 上经

  # 考：宋人的图经把三个名字的来由一次说清，最后一条是答案。
  - role: study
    narration: 宋人把来由一次说清：像蓝草，所以叫蛤蟆蓝；味道甘辛，所以叫麦句姜；香气像兰，所以叫蟾蜍兰。
    evidence:
      - text: 状如蓝，故名蛤蟆蓝。
        source: 《证类本草》· 宋（引图经）
        note: 看出来的
      - text: 其味甘、辛，故名麦句姜。
        source: 《证类本草》· 宋（引图经）
        note: 尝出来的
      - text: 香气似兰，故名蟾蜍兰。
        source: 《证类本草》· 宋（引图经）
        note: 闻出来的

  # 收：盖印 + 下集预告 + 小字免责。
  - role: closing
    narration: 三次观察，留下三个名字。下一味，龙骨。

sources:
  - 《神农本草经》卷一·上经（汉）
  - 《证类本草》卷七（宋·唐慎微，引《本草图经》）
