# 本草一问 · 11 · 天名精
#
# 这一集问的是：《本经》一条药底下并列三个名字，为什么要有三个。
#
# 答案不在《本经》里，在宋人的图经里，而且是三句话、三件事：
# 「状如蓝，故名蛤蟆蓝」——看出来的；
# 「其味甘、辛，故名麦句姜」——尝出来的；
# 「香气似兰，故名蟾蜍兰」——闻出来的。
# 三个名字不是三味药，是一株草被看了、尝了、闻了各一次。
#
# 《异苑》那条传说（刘烬射獐，草塞五脏，獐蹶然而起，因名「活鹿草」）不在
# 《本经》三个别名里，名字说鹿而故事里射的是獐，这一集不展开——留给后面。
#
# 「书」屏读的是别名那几个字（read 必须同时是旁白与引文的连续子串，ask:build 两头都核）。
# 底本作「虾蟆蓝」，《证类》引图经作「蛤蟆蓝」，同物异写；屏幕照底本。

