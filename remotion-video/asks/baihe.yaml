# 本草一问 · 09 · 百合
#
# 「古书写错的字」第三集——但这一集的结论和上一集相反。
#
# 底本《神农本草经》作「邪气腹张」，而《证类本草》《本草纲目》都作「腹胀」。
# `npm run variants` 把这一条报成 1 : 5，也就是说底本那一读法全库还有一处作证——
# 而那一处正是《名医别录》抄的《本经》原文。两个抄本都作「张」，宋人才改成「胀」。
#
# 关键证据在第四条：《醉花窗医案》（清）里还在写「转增腹张」。
# **如果这是抄手写错，它不会在一千多年后一本毫不相干的医案里再出现一次。**
# 所以这一集的答案不是"底本错了"，而是"那时候「胀」还没有从「张」里分出来"。
#
# 「书」屏摆的是本经全文，旁白只读其中「腹张」两个字。
#
# 配图说明：`baihe-flower` 的观察者鉴定是 `Lilium brownii viridulum`——那是
# Lilium brownii 的一个变种，同一个种，所以 ⚠ 在这里是变种级的差异，不是配错。
# 其余三张 CC0，鉴定为 Lilium brownii。
# 单味药线的百合片用了 `lilium-brownii-baihe.jpg`，这一集不重复用它。

id: baihe
entry: 百合
collection: 古书写错的字
deck: 古书写错的字 · 03
question: "「腹张」为什么\n不算错字？"
accent: "#4a6b5a"                 # 草部青
music: music/gaoshan-liushui.mp3
next: 白棘——「渍脓」还是「溃脓」？
disclaimer: 古籍内容展示，不构成诊疗建议

segments:
  # 问：全幅实物照 + 大字问题。第 0 帧即封面。
  - role: ask
    narration: 《神农本草经》给百合写的是「邪气腹张」，别的书都写「腹胀」。
    photos:
      - file: baihe-flower.jpg
        caption: 百合

  # 物：它今天是什么、你在哪见过它。
  - role: object
    narration: 百合是百合科的草本，夏天开白花。它的鳞茎由许多瓣抱成，名字就是从这儿来的。
    photos:
      - file: baihe-stalks.jpg
        caption: 一丛白花
      - file: baihe-buds.jpg
        caption: 还没开的花苞
      - file: baihe-leaves.jpg
        caption: 叶是披针形的

  # 书：竖排原文，读到哪个字哪个字朱红。
  - role: book
    narration: 《神农本草经》给百合写的是「邪气腹张」——张，是开张的张。
    read: 腹张
    quote:
      text: 味甘，平。主邪气腹张，心痛，利大小便，补中益气。生川谷。
      source: 《神农本草经》卷二 · 中经

  # 考：跨书对读。前三条是"谁改成了胀"，第四条才是这一集的答案。
  - role: study
    narration: 可这个字不是抄错。《名医别录》抄《本经》，写的也是「张」；到宋代才改成「胀」，李时珍也写「胀」。可一千多年后，清代的医案里还在写「腹张」。
    evidence:
      - text: 主邪气腹张，心痛，利大小便，补中益气。
        source: 《名医别录》引《本经》原文 · 梁
        note: 抄《本经》时也写「张」
      - text: 主邪气腹胀，心痛，利大小便，补中益气。
        source: 《证类本草》· 宋（唐慎微）
        note: 宋人改写成了「胀」
      - text: 邪气腹胀心痛，利大小便，补中益气（《本经》）。
        source: 《本草纲目》草部 · 明（李时珍）
        note: 注明出自《本经》，用的是「胀」
      - text: 命服地黄汤，转增腹张
        source: 《醉花窗医案》· 清
        note: 清人写腹胀，还在用「张」

  # 收：盖印 + 下集预告 + 小字免责。
  - role: closing
    narration: 不是写错——那时候，「胀」还没从「张」里分出来。下一味，白棘。

sources:
