name: CI

# Runs the guards that used to depend on somebody remembering to type `npm test`.
# The compliance gate, the repeated-text scan and the ledger check all live here,
# so a film that breaks the rules cannot reach a render unnoticed.
#
# The repository root is the workspace root, so the code lives one level down.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: remotion-video

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint and typecheck
        run: npm run lint

      - name: Rule check over every film
        run: npm run check

      # 「本草一问」系列（B 站竖屏）有自己的一套规则：三条内容规则加一节 sync。
      # 跑在这里而不是只跑在 ask-render.yml 里，是因为它不需要网络也不需要渲染——
      # 一个被改坏的 YAML 应该在 CI 的第一道关就被拦下，而不是等到出片那一步。
      - name: Rule check over every 「本草一问」 episode
        run: npm run ask:check

      # 注册表是生成的（scripts/ask-compositions.mjs），所以要检查它与 src/asks/ 同步——
      # 否则新加的集会有内容模块却没有 Composition，而那要到渲染时才报错。
      - name: Composition registry is in sync with src/asks
        run: |
          npm run ask:compositions
          if ! git diff --quiet -- src/asks/Compositions.tsx; then
            echo "src/asks/Compositions.tsx is stale — run 'npm run ask:compositions' and commit the result."
            git diff -- src/asks/Compositions.tsx
            exit 1
          fi

      - name: Composition registry is in sync with src/finished
        run: |
          npm run gen
          if ! git diff --quiet -- src/Composition.tsx; then
            echo "src/Composition.tsx is stale — run 'npm run gen' and commit the result."
            git diff -- src/Composition.tsx
            exit 1
          fi

      - name: Progress ledger is in sync with the films
        run: |
          npm run progress
          if ! git diff --quiet -- progress.json; then
            echo "progress.json is stale — run 'npm run progress' and commit the result."
            git diff -- progress.json
            exit 1
          fi

      - name: Master ledger is current
        run: npm run manifest
